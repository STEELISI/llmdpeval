# Relevant outlines per query: {query_id: {framework: [outline ids]}}.
# "Relevant" = an outline a good retriever must surface for this query. hit@K counts a hit if ANY listed id is in the top K.
# An empty list means the corpus has no outline for it (a corpus gap); those queries are skipped in scoring and listed separately.
# None = no framework named in the prompt -> the NumPy outlines are the relevant ones.

# ---- Held-out test queries (the 3 grid tasks): never tune on these ----
stat_count:
  OpenDP: [opendp-count-laplace, opendp-sized-vs-unsized-domains, opendp-canonical-noise-hypothesis-test, opendp-polars-conditional-sum-filter]
  Diffprivlib: [diffprivlib-count-nonzero, diffprivlib-laplace-mechanism-direct, diffprivlib-geometric-integer-count]
  None: [numpy-laplace-count]
# The two-histograms rate items were added as relevant after the first labels. The task scores PROPORTIONS; the
# older peeling items are valid DP but near-random for rates (simulation: 21% vs 100% >=3 of top 5), so both count.
selection_topk:
  OpenDP: [opendp-topk-rate-two-histograms]   # opendp-noisy-top-k removed from the corpus
  Diffprivlib: [diffprivlib-topk-rate-two-histograms, diffprivlib-exponential-topk-peeling]
  None: [numpy-topk-rate-two-histograms, numpy-topk-selection, numpy-noisy-max-score-sensitivity, numpy-groupwise-rate-noisy-ratio]
ml_regression:
  OpenDP: [opendp-theil-sen-linear-regression]
  Diffprivlib: [diffprivlib-linear-regression]
  None: [numpy-linear-regression-sufficient-stats]

